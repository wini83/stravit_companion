name: Finalize release

on:
  pull_request:
    types:
      - closed
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: finalize-release-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  finalize-release:
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'release/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Configure release author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Resolve release version
        id: version
        env:
          RELEASE_BRANCH: ${{ github.event.pull_request.head.ref }}
        shell: bash
        run: |
          version="${RELEASE_BRANCH#release/v}"
          if [[ -z "$version" || "$version" == "$RELEASE_BRANCH" ]]; then
            echo "Unable to resolve release version from branch: $RELEASE_BRANCH" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Create and push release tag
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          tag="v${RELEASE_VERSION}"
          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            echo "Tag ${tag} already exists locally."
          else
            git tag -a "$tag" -m "$tag"
          fi
          git push origin "$tag"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Extract release notes from changelog
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: python scripts/extract_release_notes.py "v${RELEASE_VERSION}" release-notes.md

      - name: Create draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          tag="v${RELEASE_VERSION}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "GitHub Release ${tag} already exists."
          else
            gh release create "$tag" \
              --draft \
              --verify-tag \
              --title "$tag" \
              --notes-file release-notes.md
          fi

      - name: Delete merged release branch
        env:
          RELEASE_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: git push origin --delete "$RELEASE_BRANCH"
