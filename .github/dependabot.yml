version: 2

updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    target-branch: "dev"
    open-pull-requests-limit: 5

    groups:
      app-stack:
        patterns:
          - "click"
          - "loguru"
          - "pydantic"
          - "pydantic-settings"
          - "requests"
          - "sqlalchemy"
          - "tabulate"
          - "tenacity"

      tooling:
        patterns:
          - "black"
          - "commitizen"
          - "isort"
          - "mypy"
          - "pre-commit"
          - "pytest"
          - "pytest-cov"
          - "ruff"
          - "types-requests"

    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"

    commit-message:
      prefix: "deps"

    labels:
      - "dependencies"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    target-branch: "dev"
    open-pull-requests-limit: 3

    groups:
      github-actions:
        patterns:
          - "*"

    commit-message:
      prefix: "ci"

    labels:
      - "dependencies"
      - "github-actions"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    target-branch: "dev"
    open-pull-requests-limit: 2

    groups:
      docker:
        patterns:
          - "*"

    commit-message:
      prefix: "deps"

    labels:
      - "dependencies"
      - "docker"
